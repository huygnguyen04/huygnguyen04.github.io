short_bio: >-
  <p>I am a first-year <strong>Ph.D. student in Computer Science</strong> at the
  <a href="https://cai.wisc.edu/" target="_blank" rel="noopener">University of Wisconsin–Madison</a>,
  focusing on <strong>GPU Architecture and Hardware Acceleration</strong>.</p>

  <p>Previously, I worked with
  <a href="https://www.cs.virginia.edu/~skadron/" target="_blank" rel="noopener">Prof. Kevin Skadron</a>
  at the <a href="https://engineering.virginia.edu/department/computer-science" target="_blank" rel="noopener">University of Virginia</a>
  on modernizing the <a href="https://rodinia.cs.virginia.edu/"><strong>Rodinia Benchmark Suite</strong></a>
  for modern GPU systems. I also worked with
  <a href="https://engineering.virginia.edu/faculty/keivan-esfarjani" target="_blank" rel="noopener">Prof. Keivan Esfarjani</a>
  on GPU-accelerated molecular dynamics simulations and machine learning for materials modeling.</p>

  <p>As Moore's Law approaches its physical limits, I am interested in how <strong>architectural innovation</strong> 
  can improve the efficiency and performance of modern computing systems.</p>

